<!DOCTYPE html>
<html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="doc-title">Prerequisite Tree · Вика — Глобальное масштабирование</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f4f8;color:#1e293b;font-size:13px;overflow-x:auto}
#page-wrap{min-width:max-content;padding:40px 40px 80px;position:relative}
h1{text-align:center;font-size:20px;font-weight:800;color:#1e3a5f;margin-bottom:6px}
.subtitle{text-align:center;font-size:12px;color:#64748b;margin-bottom:20px}

/* === TOOLBAR === */
.toolbar{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:22px;flex-wrap:wrap}
.load-btn{background:#3b82f6;color:#fff;border:none;border-radius:8px;padding:7px 18px;font-size:12px;font-weight:700;cursor:pointer;transition:background .15s;display:flex;align-items:center;gap:6px}
.load-btn:hover{background:#2563eb}
.load-btn svg{flex-shrink:0}
.toolbar-hint{font-size:11px;color:#94a3b8}
.load-status{font-size:11px;font-weight:600;padding:4px 10px;border-radius:6px;display:none}
.load-status.ok{background:#dcfce7;color:#16a34a;display:inline-block}
.load-status.err{background:#fee2e2;color:#dc2626;display:inline-block}

/* === EMPTY STATE === */
.empty-state{text-align:center;padding:80px 40px;color:#94a3b8}
.empty-state .icon{font-size:48px;margin-bottom:16px}
.empty-state .msg{font-size:16px;font-weight:600;color:#64748b;margin-bottom:8px}
.empty-state .hint{font-size:12px}

/* === TREE TOPOLOGY === */
.tree{display:inline-flex;flex-direction:column;align-items:center;margin:0 auto;position:relative;z-index:10}
.branch{display:flex;flex-direction:column;align-items:center}
.stem{width:2px;height:14px;background:#a8c4dd;flex-shrink:0}
.children{display:flex;flex-direction:row;gap:12px;align-items:flex-start;padding:10px 12px;border:1.5px solid #d0dce8;border-radius:10px;background:rgba(255,255,255,.3)}
.children:has(> .branch:only-child){border:none;padding:0;background:none}
.children.collapsed{display:none}

/* === COLLAPSE TOGGLE === */
.collapse-wrap{display:flex;flex-direction:column;align-items:center}
.collapse-btn{background:#e2e8f0;border:1.5px solid #cbd5e1;border-radius:8px;padding:4px 12px;font-size:10px;font-weight:700;color:#475569;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.collapse-btn:hover{background:#cbd5e1;border-color:#94a3b8}
.collapse-btn .arrow{display:inline-block;transition:transform .15s;font-size:8px}
.collapse-btn.is-collapsed .arrow{transform:rotate(0deg)}
.collapse-btn.is-expanded .arrow{transform:rotate(90deg)}
.collapsed-summary{width:172px;background:#fff;border:1.5px solid #d0dce8;border-radius:8px;padding:8px 10px;margin-top:2px;display:none}
.collapsed-summary.visible{display:block}
.collapsed-item{font-size:10px;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:2px 0;border-bottom:1px solid #f1f5f9;line-height:1.4}
.collapsed-item:last-child{border-bottom:none}
.collapsed-item .ci-type{font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin-right:4px}
.ci-cond{color:#3b82f6}
.ci-constr{color:#cb2431}
.ci-dec{color:#22c55e}
.ci-task{color:#6f42c1}
.ci-q{color:#b45309}
.ci-other{color:#64748b}

/* === CARDS === */
.card{width:172px;display:flex;flex-direction:column;background:#fff;border-radius:10px;border:1.5px solid #d0dce8;cursor:pointer;position:relative;overflow:visible;flex-shrink:0;z-index:5}
.card-body{padding:9px 10px 6px;min-height:75px;display:flex;flex-direction:column;justify-content:flex-start}
.node-type{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.card-text{font-size:11px;line-height:1.45;color:#334155}
.card-footer{padding:4px 10px 6px;border-top:1px solid #e2e8f0;display:flex;justify-content:flex-end}
.status-badge{font-size:9px;font-weight:700;padding:2px 8px;border-radius:10px;background:#e2e8f0;color:#64748b}

/* Node types */
.n-goal{background:#1e3a5f;border-color:#1e3a5f;color:#fff;width:340px}
.n-goal .node-type{color:#93c5fd}
.n-goal .card-text{color:#e2e8f0}
.n-cond{border-left:4px solid #3b82f6}
.n-cond .node-type{color:#3b82f6}
.n-constr{border:1.5px solid #cb2431;background:#fffaf5}
.n-constr .node-type{color:#cb2431}
.n-q{border:1.5px solid #eab308;background:#fffef0}
.n-q .node-type{color:#b45309}
.n-dec{border:1.5px solid #22c55e;background:#f0fdf4}
.n-dec .node-type{color:#16a34a}
.n-task{border:1.5px solid #6f42c1;background:#f9f5ff}
.n-task .node-type{color:#6f42c1}
.n-fact{border:1.5px solid #64748b;background:#f8fafc}
.n-fact .node-type{color:#64748b}
.n-note{border-left:4px solid #64748b;background:#f8fafc}
.n-note .node-type{color:#64748b}
.n-risk{border-left:4px solid #f59e0b;background:#fffbeb}
.n-risk .node-type{color:#92400e}

/* === GROUPS === */
/* Группа-контейнер: рамка вокруг горизонтально развернутых ветвей (2+ ребёнка).
   Для линейных цепочек (1 ребёнок) используется card-group-badge — компактная метка. */
.group{border:1.5px solid #a8c4dd;border-radius:14px;background:#ebf3fb;padding:28px 16px 18px;position:relative;z-index:1}
.group-label{position:absolute;top:-12px;left:14px;background:#5b8db8;color:#fff;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 12px;border-radius:20px;z-index:5}
.group-crit{border-color:#f59e0b88;background:#fef9ee}
.group-crit .group-label{background:#d97706}
.group-par{border-color:#8b5cf688;background:#f5f3ff}
.group-par .group-label{background:#7c3aed}
.group-bg{border-color:#94a3b888;background:#f1f5f9}
.group-bg .group-label{background:#64748b}
.group-accent{border-color:#ec489988;background:#fdf2f8}
.group-accent .group-label{background:#db2777}
/* Card-level group badge: compact label when group has single-child chain */
.card-group-badge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 10px;border-radius:12px;color:#fff;margin-bottom:4px;background:#5b8db8}
.card-group-badge.badge-crit{background:#d97706}
.card-group-badge.badge-par{background:#7c3aed}
.card-group-badge.badge-bg{background:#64748b}
.card-group-badge.badge-accent{background:#db2777}

/* === SIDEBAR MODULE v2 ===
   Sidebar — компактный блок карточек СПРАВА от родительской карточки.
   Не разрывает основную вертикальную цепочку: sidebar-attach позиционируется
   абсолютно, не влияя на ширину branch и центрирование stem.
   Два режима: parallel (параллельные элементы) и chain (последовательная цепочка).
   Режим определяется автоматически или вручную через JSON.
   JSON: "sidebar": true  или  "sidebar": { "mode": "parallel"|"chain" }
*/
.sidebar-row{position:relative;display:inline-flex;align-items:center}
.sidebar-attach{position:absolute;top:50%;left:100%;transform:translateY(-50%);display:flex;flex-direction:row;align-items:center;z-index:3;pointer-events:auto}
.sidebar-connector{width:22px;height:2px;background:#a8c4dd;flex-shrink:0}
.sidebar-block{position:relative;display:flex;flex-direction:row;align-items:center;border:1.5px solid #a8c4dd;border-radius:12px;padding:14px 16px 14px 12px;background:rgba(255,255,255,.35)}
/* Group styling on sidebar block */
.sidebar-block.group{padding-top:28px}
.sidebar-block .group-label{position:absolute;top:-12px;left:14px}
/* --- Parallel mode: vertical dashes from top border to each card --- */
.sidebar-block.sb-parallel{align-items:flex-end;padding-top:32px}
.sidebar-block.sb-parallel .sb-item{position:relative;display:flex;flex-direction:column;align-items:center}
.sidebar-block.sb-parallel .sb-item::before{content:'';position:absolute;top:-32px;left:50%;width:0;border-left:2px dashed #a8c4dd;height:32px;z-index:0}
.sidebar-block.sb-parallel.group .sb-item::before{top:-28px;height:28px}
.sidebar-block.sb-parallel .sb-item+.sb-item{margin-left:10px}
/* --- Chain mode: horizontal lines between cards --- */
.sidebar-block.sb-chain .sb-item{position:relative;display:flex;flex-direction:row;align-items:center}
.sidebar-block.sb-chain .sb-item+.sb-item::before{content:'';display:inline-block;width:14px;height:2px;background:#a8c4dd;flex-shrink:0}
.sidebar-block.sb-chain .sb-item:first-child::before{content:'';display:inline-block;width:8px;height:2px;background:#a8c4dd;flex-shrink:0}
/* Cards inside sidebar are smaller */
.sidebar-block .card{width:140px}
.sidebar-block .card .card-body{min-height:52px;padding:6px 8px 4px}
.sidebar-block .card .node-type{font-size:8px;margin-bottom:2px}
.sidebar-block .card .card-text{font-size:10px;line-height:1.35}
/* Recursive sidebar: nested children rendered vertically under parent card */
.sb-subtree{display:flex;flex-direction:column;align-items:center}
.sb-subtree .sb-stem{width:1.5px;height:10px;background:#a8c4dd;flex-shrink:0}
.sb-subtree .sb-children{display:flex;flex-direction:row;gap:6px;align-items:flex-start;padding:6px 8px;border:1px solid #d0dce8;border-radius:8px;background:rgba(255,255,255,.25)}
.sb-subtree .sb-children:has(> .sb-subtree:only-child){border:none;padding:0;background:none}

/* === CLICKABILITY INDICATOR: dog-ear corner fold === */
.card:has(.popup-box){overflow:hidden}
.card:has(.popup-box)::before{content:'';position:absolute;bottom:0;right:0;width:22px;height:22px;background:linear-gradient(135deg,transparent 50%,#f59e0b 50%);border-radius:0 0 9px 0;transition:all .2s ease;z-index:6}
.card:has(.popup-box)::after{content:'\24D8';position:absolute;bottom:1px;right:2px;font-size:10px;font-weight:700;color:#fff;z-index:7;transition:all .2s ease;line-height:1}
.card:has(.popup-box):hover::before{width:30px;height:30px;background:linear-gradient(135deg,transparent 50%,#ea580c 50%)}
.card:has(.popup-box):hover::after{font-size:14px;bottom:2px;right:3px}
.card.hide-info-icon::before,.card.hide-info-icon::after{display:none !important}

/* === POPUP === */
.popup-box{display:none !important}
#popup-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:rgba(0,0,0,.08);pointer-events:none}
#popup-overlay.visible{display:block}
#popup-overlay .popup-backdrop{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:auto}
#popup-overlay .popup-clone{position:fixed;pointer-events:auto;background:#fff;border:2px solid #3b82f6;border-radius:14px;box-shadow:0 12px 48px rgba(0,0,0,.3),0 0 0 4px rgba(59,130,246,.15);padding:16px 18px;width:min(440px,calc(100vw - 40px));max-height:calc(100vh - 40px);overflow-y:auto;font-size:12px;color:#1e293b;line-height:1.7}
#popup-overlay .popup-clone .popup-title{font-size:13px;font-weight:800;color:#1e3a5f;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid #e2e8f0}
#popup-overlay .popup-clone .popup-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:2px}
#popup-overlay .popup-clone .popup-quote{font-style:italic;color:#475569;border-left:3px solid #cbd5e1;padding-left:10px;margin:6px 0}
#popup-overlay .popup-clone .p-sec{margin-bottom:8px}
#popup-overlay .popup-clone .p-sec strong{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:#64748b;margin-bottom:2px}

/* === TASK BOARD === */
.task-board{max-width:820px;margin:40px auto 0;background:#fff;border-radius:14px;border:1.5px solid #d0dce8;padding:20px 24px;z-index:0;position:relative}
.task-board h2{font-size:15px;font-weight:800;color:#1e3a5f;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #e2e8f0}
.task-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;position:relative}
.task-item:last-child{border-bottom:none}
.task-check{flex-shrink:0;display:flex;align-items:center}
.task-checkbox{width:16px;height:16px;cursor:pointer}
.task-assignee{font-size:11px;font-weight:700;color:#7c3aed;white-space:nowrap;flex-shrink:0}
.task-text{font-size:12px;color:#334155;cursor:pointer;text-decoration:underline dotted #94a3b8}
.task-text:hover{color:#3b82f6}
.task-item input:checked ~ .task-text{text-decoration:line-through;color:#94a3b8}
.task-item input:checked ~ .task-assignee{opacity:.5}
.task-popup{display:none !important}

/* === LEGEND === */
.legend{display:flex;gap:14px;justify-content:center;margin-bottom:24px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#64748b}
.legend-swatch{width:14px;height:14px;border-radius:4px;border:1.5px solid}
.sw-goal{background:#1e3a5f;border-color:#1e3a5f}
.sw-cond{background:#fff;border-color:#3b82f6;border-left:3px solid #3b82f6}
.sw-constr{background:#fffaf5;border-color:#cb2431}
.sw-q{background:#fffef0;border-color:#eab308}
.sw-dec{background:#f0fdf4;border-color:#22c55e}
.sw-task{background:#f9f5ff;border-color:#6f42c1}
</style>
</head>

<script>
// ================================================================
// JS-ДВИЖОК GOAL TREE v2.1 — УНИВЕРСАЛЬНЫЙ + SIDEBAR MODULE v3
// Changelog vs v2.0:
//   - Sidebar поддерживает рекурсивную вложенность (renderSidebarItem)
//   - Sidebar-дети с собственными children отображают мини-дерево
// Changelog vs v1.1:
//   - Sidebar крепится СПРАВА от карточки (position:absolute)
//   - saveHtml() очищает DOM перед сохранением
//   - Группа-контейнер только при 2+ горизонтальных детях
// ================================================================

var TYPE_MAP = {
  'goal':       { cls: 'n-goal',   label: 'Цель' },
  'condition':  { cls: 'n-cond',   label: 'Условие' },
  'constraint': { cls: 'n-constr', label: 'Блокер' },
  'question':   { cls: 'n-q',      label: 'Вопрос' },
  'decision':   { cls: 'n-dec',    label: 'Решение' },
  'task':       { cls: 'n-task',   label: 'Задача' },
  'fact':       { cls: 'n-fact',   label: 'Факт' },
  'note':       { cls: 'n-note',   label: 'Примечание' },
  'risk':       { cls: 'n-risk',   label: 'Риск' }
};

var GROUP_COLOR_MAP = {
  'crit': 'group-crit', 'par': 'group-par',
  'bg': 'group-bg', 'accent': 'group-accent'
};

var BADGE_COLOR_MAP = {
  'crit': 'badge-crit', 'par': 'badge-par',
  'bg': 'badge-bg', 'accent': 'badge-accent'
};

var LEGEND_ITEMS = [
  ['sw-goal','Цель'],['sw-cond','Условие'],['sw-constr','Блокер'],
  ['sw-q','Вопрос'],['sw-dec','Решение'],['sw-task','Задача']
];

function el(tag, cls) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

// === Renders a single card element (reusable by renderNode and renderSidebarBlock) ===
function renderCard(node) {
  var ti = TYPE_MAP[node.type] || { cls: 'n-fact', label: node.type };
  var card = el('div', 'card ' + ti.cls);
  if (node.id) card.id = node.id;
  if (node.hide_info_icon) card.classList.add('hide-info-icon');
  var body = el('div', 'card-body');
  var nt = el('div', 'node-type');
  nt.textContent = ti.label;
  body.appendChild(nt);
  var ct = el('div', 'card-text');
  ct.textContent = node.text;
  body.appendChild(ct);
  card.appendChild(body);
  if (node.popup) {
    var pb = el('div', 'popup-box');
    var pt = el('div', 'popup-title');
    pt.textContent = node.popup.title;
    pb.appendChild(pt);
    (node.popup.sections || []).forEach(function(s) {
      var lbl = el('div', 'popup-label');
      lbl.textContent = s.label;
      pb.appendChild(lbl);
      if (s.content) {
        var p = el('p'); p.textContent = s.content; pb.appendChild(p);
      }
      if (s.quotes) {
        s.quotes.forEach(function(q) {
          var qe = el('div', 'popup-quote'); qe.textContent = q; pb.appendChild(qe);
        });
      }
    });
    card.appendChild(pb);
  }
  if (node.assignee) {
    var footer = el('div', 'card-footer');
    var badge = el('span', 'status-badge');
    badge.textContent = node.assignee;
    footer.appendChild(badge);
    card.appendChild(footer);
  }
  return card;
}

// === Sidebar: auto-detect mode ===
function getSidebarMode(node) {
  if (node.sidebar && typeof node.sidebar === 'object' && node.sidebar.mode) return node.sidebar.mode;
  if (!node.children || node.children.length === 0) return 'parallel';
  var firstType = node.children[0].type;
  var allSame = node.children.every(function(c) { return c.type === firstType; });
  return allSame ? 'parallel' : 'chain';
}

// === Sidebar: render a single item recursively (card + optional subtree) ===
function renderSidebarItem(node) {
  var subtree = el('div', 'sb-subtree');
  subtree.appendChild(renderCard(node));
  if (node.children && node.children.length > 0) {
    subtree.appendChild(el('div', 'sb-stem'));
    var ch = el('div', 'sb-children');
    node.children.forEach(function(child) {
      ch.appendChild(renderSidebarItem(child));
    });
    subtree.appendChild(ch);
  }
  return subtree;
}

// === Sidebar: render compact block with recursive support ===
function renderSidebarBlock(sidebarNode) {
  var block = el('div', 'sidebar-block');
  var mode = getSidebarMode(sidebarNode);
  block.classList.add(mode === 'chain' ? 'sb-chain' : 'sb-parallel');
  if (sidebarNode.group) {
    block.classList.add('group');
    if (sidebarNode.group.color && GROUP_COLOR_MAP[sidebarNode.group.color]) {
      block.classList.add(GROUP_COLOR_MAP[sidebarNode.group.color]);
    }
    var gl = el('div', 'group-label');
    gl.textContent = sidebarNode.group.label;
    block.appendChild(gl);
  }
  // Root card of the sidebar node
  var rootItem = el('div', 'sb-item');
  rootItem.appendChild(renderCard(sidebarNode));
  block.appendChild(rootItem);
  // Children — rendered recursively (supports nested subtrees)
  if (sidebarNode.children && sidebarNode.children.length > 0) {
    sidebarNode.children.forEach(function(child) {
      var item = el('div', 'sb-item');
      item.appendChild(renderSidebarItem(child));
      block.appendChild(item);
    });
  }
  return block;
}

// === Main recursive renderer ===
function renderNode(node, depth) {
  if (typeof depth === 'undefined') depth = 0;
  var branch = el('div', 'branch');

  // --- Split children into sidebar vs main ---
  var sidebarNodes = [];
  var mainNodes = [];
  (node.children || []).forEach(function(c) {
    if (c.sidebar) sidebarNodes.push(c); else mainNodes.push(c);
  });

  // --- Group logic: container only when 2+ horizontal main children ---
  var useGroupContainer = false;
  if (node.group && !node.sidebar) {
    useGroupContainer = mainNodes.length > 1;
    if (useGroupContainer) {
      branch.classList.add('group');
      if (node.group.color && GROUP_COLOR_MAP[node.group.color]) {
        branch.classList.add(GROUP_COLOR_MAP[node.group.color]);
      }
      var gl = el('div', 'group-label');
      gl.textContent = node.group.label;
      branch.appendChild(gl);
    }
  }

  // --- Build the card ---
  var card = renderCard(node);
  // Group badge (compact label) when group exists but no container
  if (node.group && !node.sidebar && !useGroupContainer) {
    var gbadge = el('span', 'card-group-badge');
    if (node.group.color && BADGE_COLOR_MAP[node.group.color]) {
      gbadge.classList.add(BADGE_COLOR_MAP[node.group.color]);
    }
    gbadge.textContent = node.group.label;
    card.querySelector('.card-body').insertBefore(gbadge, card.querySelector('.card-body').firstChild);
  }

  // --- Attach sidebar (if any) to the card via absolute positioning ---
  if (sidebarNodes.length > 0) {
    var sideRow = el('div', 'sidebar-row');
    sideRow.appendChild(card);
    var sideAttach = el('div', 'sidebar-attach');
    sidebarNodes.forEach(function(sn) {
      sideAttach.appendChild(el('div', 'sidebar-connector'));
      sideAttach.appendChild(renderSidebarBlock(sn));
    });
    sideRow.appendChild(sideAttach);
    branch.appendChild(sideRow);
  } else {
    branch.appendChild(card);
  }

  // --- Render main children (excluding sidebar nodes) ---
  var childrenToRender = sidebarNodes.length > 0 ? mainNodes : (node.children || []);

  if (childrenToRender.length > 0) {
    branch.appendChild(el('div', 'stem'));
    var canCollapse = childrenToRender.length > 1 && node.type !== 'goal';

    if (canCollapse) {
      var wrap = el('div', 'collapse-wrap');
      var btn = el('button', 'collapse-btn is-expanded');
      btn.innerHTML = '<span class="arrow">&#9654;</span> <span class="label">Свернуть (' + childrenToRender.length + ')</span>';
      wrap.appendChild(btn);
      var ch = el('div', 'children');
      childrenToRender.forEach(function(c) { ch.appendChild(renderNode(c, depth + 1)); });
      wrap.appendChild(ch);
      var summary = el('div', 'collapsed-summary');
      var TYPE_SHORT = {goal:'Ц',condition:'У',constraint:'Б',question:'В',decision:'Р',task:'З',fact:'Ф'};
      var TYPE_CLS = {condition:'ci-cond',constraint:'ci-constr',decision:'ci-dec',task:'ci-task',question:'ci-q'};
      childrenToRender.forEach(function(c) {
        var item = el('div', 'collapsed-item');
        var typeSpan = '<span class="ci-type ' + (TYPE_CLS[c.type]||'ci-other') + '">' + (TYPE_SHORT[c.type]||'?') + '</span>';
        item.innerHTML = typeSpan + c.text;
        summary.appendChild(item);
      });
      wrap.appendChild(summary);
      branch.appendChild(wrap);
    } else {
      var ch = el('div', 'children');
      childrenToRender.forEach(function(c) { ch.appendChild(renderNode(c, depth + 1)); });
      branch.appendChild(ch);
    }
  }

  return branch;
}

function renderTaskBoard(tasks) {
  var board = el('div', 'task-board');
  var h2 = el('h2'); h2.textContent = 'Доска задач'; board.appendChild(h2);
  tasks.forEach(function(task) {
    var item = el('div', 'task-item');
    item.setAttribute('data-task-id', task.id);
    var lbl = el('label', 'task-check');
    var cb = el('input'); cb.type = 'checkbox'; cb.className = 'task-checkbox';
    lbl.appendChild(cb); item.appendChild(lbl);
    var asgn = el('span', 'task-assignee'); asgn.textContent = task.assignee; item.appendChild(asgn);
    var txt = el('span', 'task-text'); txt.textContent = task.text; item.appendChild(txt);
    if (task.context || task.decision || task.formulation) {
      var pop = el('div', 'task-popup');
      var html = '';
      if (task.context) html += '<div class="p-sec"><strong>Контекст</strong>' + task.context + '</div>';
      if (task.decision) html += '<div class="p-sec"><strong>Решение</strong>' + task.decision + '</div>';
      if (task.formulation) html += '<div class="p-sec"><strong>Формулировка</strong>' + task.formulation + '</div>';
      pop.innerHTML = html;
      item.appendChild(pop);
    }
    board.appendChild(item);
  });
  return board;
}

function renderLegend() {
  var root = document.getElementById('legend-root');
  root.innerHTML = LEGEND_ITEMS.map(function(i) {
    return '<div class="legend-item"><div class="legend-swatch ' + i[0] + '"></div>' + i[1] + '</div>';
  }).join('');
}

function renderAll(data) {
  document.getElementById('page-title').textContent = data.meta.title;
  document.title = data.meta.title;
  document.getElementById('page-subtitle').textContent =
    data.meta.subtitle + ' \u00b7 v' + data.meta.version + ' \u00b7 ' + data.meta.date;
  var tr = document.getElementById('tree-root');
  tr.innerHTML = '';
  tr.appendChild(renderNode(data.tree));
  var tbr = document.getElementById('taskboard-root');
  tbr.innerHTML = '';
  if (data.tasks && data.tasks.length > 0) tbr.appendChild(renderTaskBoard(data.tasks));
  renderLegend();
  initTaskBoard();
  initCollapse();
  var cab = document.getElementById('collapse-all-btn');
  cab.style.display = document.querySelectorAll('.collapse-btn').length > 0 ? 'flex' : 'none';
  cab.textContent = '\u229F Свернуть все ветки';
  cab.setAttribute('data-state', 'expanded');
}

function showPopup(overlay, clone, anchorRect) {
  var bd = document.createElement('div');
  bd.className = 'popup-backdrop';
  overlay.appendChild(bd);
  overlay.appendChild(clone);
  overlay.classList.add('visible');
  var pw = clone.offsetWidth;
  var ph = clone.offsetHeight;
  var left = anchorRect.left + anchorRect.width / 2 - pw / 2;
  if (left < 10) left = 10;
  if (left + pw > window.innerWidth - 10) left = window.innerWidth - pw - 10;
  var top = anchorRect.bottom + 8;
  if (top + ph > window.innerHeight - 10) top = anchorRect.top - ph - 8;
  if (top < 10) top = 10;
  clone.style.left = left + 'px';
  clone.style.top = top + 'px';
}

function closePopup() {
  var overlay = document.getElementById('popup-overlay');
  overlay.innerHTML = '';
  overlay.classList.remove('visible');
}

function initPopups() {
  var overlay = document.getElementById('popup-overlay');
  document.addEventListener('click', function(e) {
    if (e.target.closest('.popup-clone')) return;
    closePopup();
    var card = e.target.closest('.card');
    if (!card) return;
    var box = card.querySelector('.popup-box');
    if (!box) return;
    var clone = box.cloneNode(true);
    clone.style.cssText = 'display:block !important';
    clone.classList.add('popup-clone');
    showPopup(overlay, clone, card.getBoundingClientRect());
  });
}

function initTaskBoard() {
  document.querySelectorAll('.task-text').forEach(function(t) {
    t.addEventListener('click', function(e) {
      e.stopPropagation();
      closePopup();
      var overlay = document.getElementById('popup-overlay');
      var item = this.closest('.task-item');
      var pop = item.querySelector('.task-popup');
      if (!pop) return;
      var clone = pop.cloneNode(true);
      clone.style.cssText = 'display:block !important';
      clone.classList.add('popup-clone');
      var title = el('div', 'popup-title');
      title.textContent = item.querySelector('.task-text').textContent;
      clone.insertBefore(title, clone.firstChild);
      showPopup(overlay, clone, item.getBoundingClientRect());
    });
  });
}

function toggleCollapseBtn(btn, forceCollapse) {
  var wrap = btn.closest('.collapse-wrap');
  if (!wrap) return;
  var ch = wrap.querySelector(':scope > .children');
  var summary = wrap.querySelector(':scope > .collapsed-summary');
  if (!ch || !summary) return;
  var isExpanded = btn.classList.contains('is-expanded');
  var shouldCollapse = (typeof forceCollapse !== 'undefined') ? forceCollapse : isExpanded;
  if (shouldCollapse) {
    ch.classList.add('collapsed');
    summary.classList.add('visible');
    btn.classList.remove('is-expanded');
    btn.classList.add('is-collapsed');
    btn.querySelector('.label').textContent = 'Развернуть (' + ch.children.length + ')';
  } else {
    ch.classList.remove('collapsed');
    summary.classList.remove('visible');
    btn.classList.remove('is-collapsed');
    btn.classList.add('is-expanded');
    btn.querySelector('.label').textContent = 'Свернуть (' + ch.children.length + ')';
  }
}

function initCollapse() {
  document.querySelectorAll('.collapse-btn').forEach(function(btn) {
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      toggleCollapseBtn(this);
    });
  });
}

function showStatus(msg, type) {
  var s = document.getElementById('load-status');
  s.textContent = msg;
  s.className = 'load-status ' + type;
  setTimeout(function() { s.className = 'load-status'; }, 3000);
}

function handleFileLoad(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(evt) {
    var content = evt.target.result;
    var json;
    try {
      var match = content.match(/```json\s*([\s\S]*?)\s*```/);
      json = JSON.parse(match ? match[1] : content);
    } catch(err) {
      showStatus('Ошибка JSON: ' + err.message, 'err');
      return;
    }
    document.getElementById('tree-data').textContent = JSON.stringify(json, null, 2);
    renderAll(json);
    showStatus('\u2713 Загружено: ' + file.name, 'ok');
    document.getElementById('save-btn').style.display = 'flex';
  };
  reader.readAsText(file, 'UTF-8');
  e.target.value = '';
}

// === Save HTML — CLEAN: strips rendered DOM to prevent legacy HTML contamination ===
function saveHtml() {
  var clone = document.documentElement.cloneNode(true);
  // Strip all dynamically rendered content — only JSON stays
  clone.querySelector('#tree-root').innerHTML = '';
  clone.querySelector('#taskboard-root').innerHTML = '';
  clone.querySelector('#popup-overlay').innerHTML = '';
  clone.querySelector('#legend-root').innerHTML = '';
  clone.querySelector('#collapse-all-btn').style.display = 'none';
  clone.querySelector('#save-btn').style.display = 'none';
  var html = clone.outerHTML;
  var blob = new Blob(['<!DOCTYPE html>\n' + html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  var title = document.getElementById('page-title').textContent || 'goal_tree';
  a.href = url;
  a.download = title.replace(/[^\w\u0400-\u04ff\s-]/g, '').replace(/\s+/g, '_') + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showStatus('\u2713 HTML сохранён', 'ok');
}

document.addEventListener('DOMContentLoaded', function() {
  initPopups();
  document.getElementById('file-input').addEventListener('change', handleFileLoad);
  document.getElementById('load-btn').addEventListener('click', function() {
    document.getElementById('file-input').click();
  });
  document.getElementById('collapse-all-btn').addEventListener('click', function() {
    var state = this.getAttribute('data-state');
    var btns = document.querySelectorAll('.collapse-btn');
    if (state === 'expanded') {
      btns.forEach(function(btn) { toggleCollapseBtn(btn, true); });
      this.textContent = '\u229E Развернуть все ветки';
      this.setAttribute('data-state', 'collapsed');
    } else {
      btns.forEach(function(btn) { toggleCollapseBtn(btn, false); });
      this.textContent = '\u229F Свернуть все ветки';
      this.setAttribute('data-state', 'expanded');
    }
  });
  document.getElementById('save-btn').addEventListener('click', saveHtml);
  var raw = document.getElementById('tree-data').textContent.trim();
  if (raw) {
    try {
      renderAll(JSON.parse(raw));
      document.getElementById('save-btn').style.display = 'flex';
    } catch(e) { console.error('JSON parse error:', e); }
  }
});
</script>


</body></html>
